<!-- Effect: motion (light blue sparkle along the pointer path) -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- White halo outside a dark rim, so it reads on light, dark and coloured backgrounds -->
  <defs>
    <filter id="halo" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="outer"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="outer" operator="in" result="white"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="inner"/>
      <feFlood flood-color="#241f31" flood-opacity="0.85"/>
      <feComposite in2="inner" operator="in" result="dark"/>
      <feMerge>
        <feMergeNode in="white"/>
        <feMergeNode in="dark"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#halo)">
    <!-- shrunk a little so the halo fits inside the 128 px box -->
    <g transform="translate(64 64) scale(0.88) translate(-64 -64)">
  <g transform="translate(64 64)">
    <path d="M0 -56 Q6 -6 56 0 Q6 6 0 56 Q-6 6 -56 0 Q-6 -6 0 -56 Z" fill="#99c1f1" stroke="#1c71d8" stroke-width="3"/>
    <path d="M0 -26 Q3 -3 26 0 Q3 3 0 26 Q-3 3 -26 0 Q-3 -3 0 -26 Z" fill="#ffffff"/>
    <path d="M38 -44 Q40 -40 44 -38 Q40 -36 38 -32 Q36 -36 32 -38 Q36 -40 38 -44 Z" fill="#c0dcf8"/>
  </g>
    </g>
  </g>
</svg>
