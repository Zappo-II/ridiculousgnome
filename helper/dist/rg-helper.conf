# Install to /etc/rg-helper.conf. Read when rg-helper starts:
#   sudo systemctl restart rg-helper
#
# max-detail: the most rg-helper tells any subscriber about keys.
#   off, activity, classes, shortcuts (default), characters
# "shortcuts" names a key only while Ctrl, Alt or Super is held (Ctrl + T);
# typed text stays classes (letter, digit, symbol).
# Every program of the active session's user can subscribe, not only the
# extension. With "characters" every such program can read what you type.
#max-detail = shortcuts
