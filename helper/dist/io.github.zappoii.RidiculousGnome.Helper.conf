<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for rg-helper. Install to /usr/share/dbus-1/system.d/.

  Only the helper's system user may own the name. Anyone may call its
  methods: the helper itself only accepts Subscribe from the user of the
  active, unlocked session on seat0, and sends signals unicast to
  subscribers only.
-->
<busconfig>
  <policy user="rg-helper">
    <allow own="io.github.zappoii.RidiculousGnome.Helper"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.zappoii.RidiculousGnome.Helper"
           send_interface="io.github.zappoii.RidiculousGnome.Helper"/>
    <allow send_destination="io.github.zappoii.RidiculousGnome.Helper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.zappoii.RidiculousGnome.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.zappoii.RidiculousGnome.Helper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
