# .deb and .rpm of rg-helper from the static binary: `make deb`, `make rpm`.
# The Makefile sets VERSION (without the leading v); paths are
# relative to the checkout root. Same files as helper/install.sh, with the
# binary in /usr/libexec (SELinux on Fedora, see CONTRIBUTING.md).
name: rg-helper
arch: amd64
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: Zappo-II <31073175+Zappo-II@users.noreply.github.com>
description: |
  Input helper for the RidiculousGnome GNOME Shell extension.
  Reads keyboards, mice and touchpads (evdev) as the system user rg-helper
  and hands the events over the system bus only to the user of the active,
  unlocked session. Key labels are limited by max-detail in
  /etc/rg-helper.conf (default: shortcuts like Ctrl + T, no typed text).
homepage: https://github.com/Zappo-II/ridiculousgnome
license: GPL-2.0-or-later

depends:
  - systemd
  - dbus

contents:
  - src: helper/target/x86_64-unknown-linux-musl/release/rg-helper
    dst: /usr/libexec/rg-helper
    file_info:
      mode: 0755
  - src: helper/dist/rg-helper.service
    dst: /usr/lib/systemd/system/rg-helper.service
  - src: helper/dist/rg-helper.sysusers.conf
    dst: /usr/lib/sysusers.d/rg-helper.conf
  - src: helper/dist/io.github.zappoii.RidiculousGnome.Helper.conf
    dst: /usr/share/dbus-1/system.d/io.github.zappoii.RidiculousGnome.Helper.conf
  - src: helper/dist/io.github.zappoii.RidiculousGnome.Helper.service
    dst: /usr/share/dbus-1/system-services/io.github.zappoii.RidiculousGnome.Helper.service
  - src: helper/dist/rg-helper.conf
    dst: /etc/rg-helper.conf
    type: config|noreplace
  - src: packaging/copyright
    dst: /usr/share/doc/rg-helper/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/rg-helper/LICENSE
    type: license
    packager: rpm
  - src: build/THIRD-PARTY-LICENSES
    dst: /usr/share/doc/rg-helper/THIRD-PARTY-LICENSES
    packager: deb
  - src: build/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/rg-helper/THIRD-PARTY-LICENSES
    type: license
    packager: rpm

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
